<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Goudy+Bookletter+1911&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --w: 2160px;
    --h: 2700px;
    --padX: 140px; /* Scaled for 2k width */
    --gold: #f5c26b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    width: var(--w);
    height: var(--h);
    font-family: Inter, system-ui, sans-serif;
    color: #fff;
    overflow: hidden;
    position: relative;
    background: #0b0d12;
  }

  .photo {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    z-index: 0;
  }

  .topTint {
    position: absolute;
    inset: 0;
    z-index: 1;
    /* Darkened the bottom gradient to ensure large text is readable */
    background: 
      linear-gradient(to bottom, rgba(0,0,0,.20) 0%, rgba(0,0,0,.05) 45%, rgba(0,0,0,.80) 100%);
  }

  .etsyBadgeImage {
    position: absolute;
    top: 80px;
    left: 80px;
    width: 440px; /* Doubled size */
    z-index: 3;
    filter: drop-shadow(0 20px 48px rgba(0,0,0,.45));
  }
  .etsyBadgeImage img { width: 100%; height: auto; display: block; }

  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    padding: 0 var(--padX);
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
    padding-bottom: 240px; /* Pushes text up from the very bottom */
  }

  .panel {
    width: 100%;
    max-width: 1700px; /* Allows the review to stretch across the 2k canvas */
  }

  .stars {
    font-size: 84px; /* Scaled up */
    letter-spacing: 12px;
    color: var(--gold);
    line-height: 1;
    margin-bottom: 40px;
    text-shadow: 0 15px 35px rgba(0,0,0,.5);
  }

  .review {
    font-family: 
      "Avenir", 
      "Avenir Next", 
      "Avenir Next LT Pro", 
      "Urbanist", 
      system-ui, 
      sans-serif;
    font-size: 80px; /* Large pull-quote size */
    line-height: 1.15;
    margin: 0;
    font-weight: 400;
    text-shadow: 0 15px 35px rgba(0,0,0,.5);
  }

  .meta {
    margin-top: 50px;
    display: flex;
    align-items: center;
    gap: 30px;
    opacity: .95;
  }

  .name {
    font-size: 64px; /* Scaled up */
    font-weight: 700;
    text-shadow: 0 12px 28px rgba(0,0,0,.45);
  }

  .dot {
    width: 14px; 
    height: 14px;
    border-radius: 999px;
    background: rgba(255,255,255,.6);
  }

  .verified {
    font-size: 40px; /* Scaled up */
    font-weight: 600;
    padding: 16px 36px;
    border-radius: 999px;
    background: rgba(255,255,255,.15);
    backdrop-filter: blur(20px);
    box-shadow: 0 15px 35px rgba(0,0,0,.3);
  }

  .swipeBadge {
    position: absolute;
    right: 80px;
    bottom: 80px;
    background: rgba(255,255,255,.15);
    border-radius: 999px;
    padding: 24px 36px;
    display: flex;
    align-items: center;
    gap: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,.3);
    z-index: 3;
    backdrop-filter: blur(20px);
  }
  .swipeIcon { font-size: 60px; line-height: 1; }
  .swipeText {
    font-size: 44px; /* Scaled up */
    font-weight: 900;
    letter-spacing: 2px;
    padding-right: 15px;
    color: var(--gold);
  }
</style>
</head>

<body>
  <div class="photo" id="photo"></div>
  <div class="topTint"></div>

  <div class="etsyBadgeImage">
    <img src="https://heymichiel-alt.github.io/static-assets/etsy-review.png" alt="Etsy review badge">
  </div>

  <div class="content">
    <div class="panel">
      <div class="stars" id="stars">★★★★★</div>
      <p class="review" id="review">“…”</p>
      <div class="meta">
        <div class="name" id="byline">Customer</div>
        <div class="dot"></div>
        <div class="verified">Verified customer</div>
      </div>
    </div>
  </div>

  <div class="swipeBadge">
    <div class="swipeIcon">👈</div>
    <div class="swipeText">SWIPE</div>
  </div>

<script>
  function trimTo(s, max){
    if(!s) return "";
    s = String(s).replace(/\s+/g," ").trim();
    if (s.length <= max) return s;
    return s.slice(0,max).trimEnd() + "...";
  }

  function starsString(n){
    n = parseInt(n || "5", 10);
    if (isNaN(n)) n = 5;
    n = Math.max(1, Math.min(5, n));
    return "★★★★★".slice(0,n) + "☆☆☆☆☆".slice(0,5-n);
  }

  const p = new URLSearchParams(window.location.search);

  const imageUrl = p.get("image_url");
  const name     = p.get("name");
  const stars    = p.get("stars");
  const review   = p.get("review");

  // Background image
  if (imageUrl) {
    document.getElementById("photo").style.backgroundImage = `url('${imageUrl}')`;
  }

  // Stars
  document.getElementById("stars").textContent = starsString(stars);

  // Increased limit to 300 since we have much more space now
  const trimmed = trimTo(review, 300);
  document.getElementById("review").textContent = trimmed ? `“${trimmed}”` : "“…”";

  // Name
  const displayName = String(name || "").trim() || "Customer";
  document.getElementById("byline").textContent = displayName;
</script> 
</body>
</html>
