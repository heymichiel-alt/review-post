<!-- OPTION 3: “Magazine pull-quote” (Make.com dynamic via URL params)
     Params (from Make -> ScreenshotOne URL): image_url, review, name, stars
     Example: ?image_url=...&review=...&name=...&stars=5 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Goudy+Bookletter+1911&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --w:1080px;
    --h:1350px;
    --padX:72px;
    --gold:#f5c26b;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    width:var(--w);
    height:var(--h);
    font-family: Inter, system-ui, sans-serif;
    color:#fff;
    overflow:hidden;
    position:relative;
    background:#0b0d12;
  }

  .photo{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
    z-index:0;
  }

  .topTint{
    position:absolute;
    inset:0;
    z-index:1;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.30) 0%, rgba(0,0,0,.05) 45%, rgba(0,0,0,.68) 100%);
  }

  .etsyBadgeImage{
    position:absolute;
    top:44px;
    left:44px;
    width:220px;
    z-index:3;
    filter: drop-shadow(0 10px 24px rgba(0,0,0,.35));
  }
  .etsyBadgeImage img{ width:100%; height:auto; display:block; }

  .content{
    position:relative;
    z-index:2;
    height:100%;
    padding:0 var(--padX);
    display:flex;
    align-items:flex-end;
    justify-content:flex-start;
    padding-bottom:110px;
  }

  .panel{
    width:100%;
    max-width:920px;
  }

  .stars{
    font-size:38px;
    letter-spacing:6px;
    color:var(--gold);
    line-height:1;
    margin-bottom:18px;
    text-shadow:0 12px 28px rgba(0,0,0,.45);
  }

  .review{
    font-family:
      "Avenir",
      "Avenir Next",
      "Avenir Next LT Pro",
      "Urbanist",
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      Arial,
      sans-serif;
    font-size:36px;
    line-height:1.18;
    margin:0;
    font-weight:400;
    text-shadow:0 12px 28px rgba(0,0,0,.45);
  }

  .meta{
    margin-top:18px;
    display:flex;
    align-items:center;
    gap:14px;
    opacity:.92;
  }

  .name{
    font-family:
      "Avenir",
      "Avenir Next",
      "Avenir Next LT Pro",
      "Urbanist",
      system-ui,
      -apple-system,
      BlinkMacSystemFont;
    font-size:28px;
    font-weight:700;
    text-shadow:0 12px 28px rgba(0,0,0,.45);
  }

  .dot{
    width:6px; height:6px;
    border-radius:999px;
    background:rgba(255,255,255,.6);
  }

  .verified{
    font-size:20px;
    font-weight:600;
    padding:8px 12px;
    border-radius:999px;
    background:rgba(255,255,255,.12);
    backdrop-filter: blur(8px);
    box-shadow:0 10px 24px rgba(0,0,0,.25);
  }

  .swipeBadge{
    position:absolute;
    right:44px;
    bottom:44px;
    background:rgba(255,255,255,.15);
    border-radius:999px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 10px 28px rgba(0,0,0,.25);
    z-index:3;
    backdrop-filter: blur(8px);
  }
  .swipeIcon{ font-size:30px; line-height:1; }
  .swipeText{
    font-size:20px;
    font-weight:900;
    letter-spacing:1px;
    padding-right:10px;
    color:var(--gold);
  }
</style>
</head>

<body>
  <div class="photo" id="photo"></div>
  <div class="topTint"></div>

  <div class="etsyBadgeImage">
    <img src="https://heymichiel-alt.github.io/static-assets/etsy-review.png" alt="Etsy review badge">
  </div>

  <div class="content">
    <div class="panel">
      <div class="stars" id="stars">★★★★★</div>
      <p class="review" id="review">“…”</p>
      <div class="meta">
        <div class="name" id="byline">Customer</div>
        <div class="dot"></div>
        <div class="verified">Verified customer</div>
      </div>
    </div>
  </div>

  <div class="swipeBadge">
    <div class="swipeIcon">👈</div>
    <div class="swipeText">SWIPE</div>
  </div>

<script>
  function trimTo(s, max){
    if(!s) return "";
    s = String(s).replace(/\s+/g," ").trim();
    if (s.length <= max) return s;
    return s.slice(0,max).trimEnd() + "...";
  }

  function starsString(n){
    n = parseInt(n || "5", 10);
    if (isNaN(n)) n = 5;
    n = Math.max(1, Math.min(5, n));
    return "★★★★★".slice(0,n) + "☆☆☆☆☆".slice(0,5-n);
  }

  // Preview defaults (used only if Make/ScreenshotOne doesn't pass URL params)
  const DEFAULTS = {
    image_url: "https://i.etsystatic.com/iap/f63983/3767786649/iap_600x600.3767786649_n9nb9e47.jpg?version=0",
    name: "Amelie",
    stars: "5",
    review: "Michiel was super patient and helped me dial in the details. The mat looks incredible and feels high quality."
  };

const p = new URLSearchParams(window.location.search);

  const imageUrl = p.get("image_url");
  const name     = p.get("name");
  const stars    = p.get("stars");
  const review   = p.get("review");

  // Background image
  if (imageUrl) {
    document.getElementById("photo").style.backgroundImage = `url('${imageUrl}')`;
  }

  // Stars
  document.getElementById("stars").textContent = starsString(stars);

  // Review text (wrapped in quotes)
  const trimmed = trimTo(review, 120);
  document.getElementById("review").textContent = trimmed ? `“${trimmed}”` : "“…”";

  // Name
  const displayName = String(name || "").trim() || "Customer";
  document.getElementById("byline").textContent = displayName;
</script>
</body>
</html>
