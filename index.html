<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Goudy+Bookletter+1911&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --w:1080px;
    --h:1350px; /* 4:5 IG feed */
    --padX:72px;
    --gold:#f5c26b;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    width:var(--w);
    height:var(--h);
    font-family: Inter, system-ui, sans-serif;
    color:#fff;
    overflow:hidden;
    position:relative;
    background:#0b0d12;
  }

  .bg{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
    filter: blur(20px);
    transform: scale(1.05); /* prevents edge bleed from blur */
    z-index:0;
  }

  .overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.25);
    z-index:1;
  }

  .etsyBadgeImage{
    position:absolute;
    top:48px;
    left:48px;
    width:220px;
    z-index:3;
  }

  .etsyBadgeImage img{
    width:100%;
    height:auto;
    display:block;
  }

  .content{
    position:relative;
    z-index:2;
    height:100%;
    padding:0 var(--padX);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .reviewBlock{
    width:100%;
    max-width:900px;
    display:flex;
    justify-content:center;
  }

  .quoteCard{
    width:100%;
    background:rgba(0,0,0,.65);
    border-radius:28px;
    padding:48px 44px;
    box-shadow:0 18px 48px rgba(0,0,0,.35);
    text-align:center;
  }

  .stars{
    font-size:44px;
    letter-spacing:6px;
    color:var(--gold);
    margin-bottom:18px;
  }

  .review{
    font-family:"DM Sans", system-ui, sans-serif;
    font-size:36px;
    line-height:1.38;
    opacity:.95;
    margin:0;
  }

  .byline{
    margin-top:18px;
    font-size:24px;
    font-weight:600;
    opacity:.9;
  }

  .swipeBadge{
    position:absolute;
    right:48px;
    bottom:48px;
    background:rgba(255,255,255,.2);
    border-radius:999px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 10px 28px rgba(0,0,0,.25);
    z-index:3;
  }

  .swipeIcon{
    font-size:32px;
    line-height:1;
  }

  .swipeText{
    font-size:20px;
    font-weight:900;
    letter-spacing:1px;
    padding-right:10px;
    color:var(--gold);
  }
</style>
</head>

<body>
  <div class="bg" id="bg"></div>
  <div class="overlay"></div>

  <div class="etsyBadgeImage">
    <img src="https://heymichiel-alt.github.io/static-assets/etsy-review.png" alt="Etsy review badge">
  </div>

  <div class="content">
    <div class="reviewBlock">
      <div class="quoteCard">
        <div class="stars" id="stars">★★★★★</div>
        <p class="review" id="review">“...”</p>
        <div class="byline" id="byline">- Customer</div>
      </div>
    </div>
  </div>

  <div class="swipeBadge">
    <div class="swipeIcon">👈</div>
    <div class="swipeText">SWIPE</div>
  </div>

<script>
  function trimTo135(s){
    if(!s) return "";
    s = String(s).replace(/\s+/g," ").trim();
    if (s.length <= 135) return s;
    return s.slice(0,135).trimEnd() + "...";
  }

  function starsString(n){
    n = parseInt(n || "5", 10);
    if (isNaN(n)) n = 5;
    n = Math.max(1, Math.min(5, n));
    return "★★★★★".slice(0,n) + "☆☆☆☆☆".slice(0,5-n);
  }

  const p = new URLSearchParams(window.location.search);

  const imageUrl = p.get("image_url");
  const name     = p.get("name");
  const stars    = p.get("stars");
  const review   = p.get("review");

  if (imageUrl) {
    document.getElementById("bg").style.backgroundImage =
      `url('${imageUrl}')`;
  }

  document.getElementById("stars").textContent = starsString(stars);

  const trimmed = trimTo135(review);
  document.getElementById("review").textContent =
    trimmed ? `“${trimmed}”` : "“...”";

  const displayName = name ? String(name).trim() : "Customer";
  document.getElementById("byline").textContent = `- ${displayName}`;
</script>

</body>
</html>
