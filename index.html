<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Goudy+Bookletter+1911&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --size:1080px;
    --padX:72px;
    --gold:#f5c26b;
    --etsy:#e9611b;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    width:var(--size);
    height:var(--size);
    font-family: Inter, system-ui, sans-serif;
    color:#fff;
    overflow:hidden;
    position:relative;
    background:#0b0d12;
  }

  /* Fully blurred background */
  .bg{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
    filter:blur(7px);
    transform:scale(1.05);
    z-index:0;
  }

  .overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.35);
    z-index:1;
  }

  .content{
    position:relative;
    z-index:2;
    height:100%;
    padding:0 var(--padX);
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding-bottom:140px;
  }

  .reviewBlock{ max-width:900px; }

  .headerRow{
    display:flex;
    align-items:center;
    gap:20px;
  }

  .avatar{
    width:96px;
    height:96px;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    border:5px solid rgba(255,255,255,.15);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .avatar span{ font-size:40px; opacity:.8; }

  .nameStars{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .name{ font-size:25px; font-weight:600; }

  .stars{
    font-size:36px;
    letter-spacing:5px;
    color:var(--gold);
  }

  .separator{
    margin:22px 0;
    height:2px;
    background:rgba(255,255,255,.35);
  }

  .review{
    font-family:"DM Sans", system-ui, sans-serif;
    font-size:34px;
    line-height:1.38;
    opacity:.95;
  }

  .etsyVerified{
    position:absolute;
    left:48px;
    bottom:48px;
    display:flex;
    align-items:center;
    gap:12px;
    font-size:22px;
    color:var(--etsy);
    font-family:"Goudy Bookletter 1911", serif;
    font-weight:600;
    z-index:3;
    text-shadow:0 6px 18px rgba(0,0,0,.45);
  }

  .etsyLogo{
    width:28px;
    height:28px;
    border-radius:50%;
    background:var(--etsy);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:20px;
    line-height:1;
  }

  .swipeBadge{
    position:absolute;
    right:48px;
    bottom:48px;
    background:rgba(255,255,255,.2);
    color:#1b1f2a;
    border-radius:999px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 10px 28px rgba(0,0,0,.25);
    z-index:3;
  }

  .swipeIcon{
    font-size:32px;
    line-height:1;
  }

  .swipeText{
    font-size:20px;
    font-weight:900;
    letter-spacing:1px;
        padding-right: 10px;
        color: var(--gold);
  }
</style>
</head>

<body>
  <div class="bg" id="bg"></div>
  <div class="overlay"></div>

  <div class="content">
    <div class="reviewBlock">
      <div class="headerRow">
        <div class="avatar"><span>👤</span></div>
        <div class="nameStars">
          <div class="name" id="name">Customer</div>
          <div class="stars" id="stars">★★★★★</div>
        </div>
      </div>

      <div class="separator"></div>

      <div class="review" id="review">“...”</div>
    </div>
  </div>

  <div class="etsyVerified">
    <div class="etsyLogo">E</div>
    <div>Verified Etsy Review</div>
  </div>

  <div class="swipeBadge">
    <div class="swipeIcon">👈</div>
    <div class="swipeText">SWIPE</div>
  </div>

<script>
  function trimTo135(s){
    if(!s) return "";
    s = String(s).replace(/\s+/g," ").trim();
    if (s.length <= 135) return s;
    return s.slice(0,135).trimEnd() + "...";
  }

  function starsString(n){
    n = parseInt(n || "5", 10);
    if (isNaN(n)) n = 5;
    n = Math.max(1, Math.min(5, n));
    return "★★★★★".slice(0,n) + "☆☆☆☆☆".slice(0,5-n);
  }

  const p = new URLSearchParams(window.location.search);

  const imageUrl = p.get("image_url");
  const name     = p.get("name");
  const stars    = p.get("stars");
  const review   = p.get("review");

  if (imageUrl) {
    document.getElementById("bg").style.backgroundImage =
      `url('${imageUrl}')`;
  }

  if (name) {
    document.getElementById("name").textContent = name;
  }

  document.getElementById("stars").textContent = starsString(stars);

  const trimmed = trimTo135(review);
  document.getElementById("review").textContent =
    trimmed ? `“${trimmed}”` : "“...”";
</script>

</body>
</html>
